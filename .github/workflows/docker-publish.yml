name: Docker Image

# Public-Repo (aics-public). Baut die beiden Images aus dem öffentlichen
# Quellbaum und veröffentlicht sie — sobald der Paketzugriff gesetzt ist:
#   ghcr.io/martinzeifang/ai_compliance_suite
#   ghcr.io/martinzeifang/aics-nginx
#
# WARUM HIER UND NICHT IM PRIVATEN REPO (#1719)
# Nicht „Kunden haben es leichter" ist der Grund, sondern Überprüfbarkeit:
# Wird das Image aus dem öffentlichen Baum gebaut, zeigen die cosign-Keyless-
# Identität und die SLSA-Provenance auf einen Workflow und einen Quellbaum, die
# der Kunde lesen kann. Zusammen mit der SPDX-SBOM ist das ein belastbarer
# Integritäts-/Authentizitätsnachweis (CRA Anhang I). Zugleich verschwindet die
# Fehlerklasse „privat gebaut, öffentlich abweichend".
#
# SCHALTER: Das Veröffentlichen hängt an der Repository-Variable
# PUBLISH_IMAGES. Ist sie nicht auf "true" gesetzt, läuft der Workflow als
# reiner Sanity-Build (push: false) wie bisher — nichts bricht.
#
# VORAUSSETZUNG für PUBLISH_IMAGES=true (einmalig, nur über die GitHub-
# Oberfläche möglich): GHCR-Pakete sind an das Repo gebunden, das sie zuerst
# veröffentlicht hat (hier das private). Deshalb je Paket unter
#   Package → Settings → Manage Actions access → Add repository
# das Repo `aics-public` mit Rolle **Write** eintragen. Danach genügt der
# normale GITHUB_TOKEN; ein langlebiger PAT als Secret ist nicht nötig.
#
# Der Qualitäts-Gate bleibt im privaten Repo: Dieser Workflow sieht nur Code,
# den der Release-Sync hierher gespiegelt hat, und gespiegelt wird ausschließlich
# bei `release: published`. Das öffentliche tests.yml ist ein Rauchtest, keine
# Freigabe — die Vier-Shard-Suite mit Postgres läuft privat.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write        # GHCR-Push (nur mit gesetztem Paketzugriff wirksam)
  id-token: write        # cosign keyless (Sigstore Fulcio)
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # ein fehlschlagendes Image soll das andere nicht abbrechen
      matrix:
        include:
          # #1719/E1: Image-Namen EXPLIZIT, nicht aus dem Repo-Namen abgeleitet.
          # Der Name ist an das PRODUKT gebunden, nicht an das Repository, aus
          # dem gebaut wird — sonst hiesse das Web-Image hier `aics-public` und
          # jeder Portainer-Stack sowie jede Kunden-Compose zeigte ins Leere.
          - name: aics-web
            image: ${{ github.repository_owner }}/ai_compliance_suite
            dockerfile: ./Dockerfile
            context: .
          - name: aics-nginx
            image: ${{ github.repository_owner }}/aics-nginx
            dockerfile: ./docker/nginx.Dockerfile
            context: ./docker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: vars.PUBLISH_IMAGES == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Zwei Wege zum Push, je nachdem was eingerichtet ist:
          #  a) GITHUB_TOKEN — braucht einmalig Paketzugriff fuer dieses Repo
          #     (Package → Settings → Manage Actions access → aics-public: Write)
          #  b) Secret GHCR_TOKEN — ein PAT mit `write:packages`; greift ohne
          #     Paketzugriff, ist aber ein langlebiges Zugangsmittel.
          # Ist GHCR_TOKEN gesetzt, gewinnt es; sonst GITHUB_TOKEN.
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Install cosign
        if: vars.PUBLISH_IMAGES == 'true'
        uses: sigstore/cosign-installer@v3

      # OCI-Repository-Namen muessen kleingeschrieben sein.
      - name: Lowercase image reference
        id: img
        env:
          IMG: ${{ env.REGISTRY }}/${{ matrix.image }}
        run: echo "ref=${IMG,,}" >> "$GITHUB_OUTPUT"

      # #1516: Version aus frontend/package.json ins Image injizieren — die
      # Datei liegt im Runtime-Image nicht vor.
      - name: Read app version
        id: appver
        run: |
          V=$(grep -m1 '"version"' frontend/package.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          echo "v=${V:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Build (and push when enabled)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ vars.PUBLISH_IMAGES == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.appver.outputs.v }}
          cache-from: type=gha,scope=${{ matrix.name }}-public
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-public
          provenance: mode=max
          sbom: true

      # Signatur an den unveraenderlichen Digest, nicht an mutable Tags.
      - name: Sign image (keyless)
        if: vars.PUBLISH_IMAGES == 'true'
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.img.outputs.ref }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM
        if: vars.PUBLISH_IMAGES == 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.img.outputs.ref }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          upload-release-assets: false

      - name: Attest SBOM (keyless)
        if: vars.PUBLISH_IMAGES == 'true'
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.img.outputs.ref }}
        run: |
          cosign attest --yes \
            --predicate "sbom-${{ matrix.name }}.spdx.json" \
            --type spdxjson \
            "${IMAGE}@${DIGEST}"

      - name: Hinweis, wenn nur gebaut wurde
        if: vars.PUBLISH_IMAGES != 'true'
        run: |
          echo "::notice title=Nur Sanity-Build::Repository-Variable PUBLISH_IMAGES ist nicht 'true'."
          echo "Das Image wurde gebaut, aber nicht veroeffentlicht. Voraussetzung fuer das"
          echo "Veroeffentlichen: Paketzugriff fuer dieses Repo setzen (siehe Kopf dieser Datei),"
          echo "danach PUBLISH_IMAGES=true als Repository-Variable."
